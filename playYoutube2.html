<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Embed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .shorts-container {
            width: 315px;
            height: 560px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .shorts-container iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .error-message {
            color: #fff;
            padding: 20px;
            text-align: center;
            display: none;
        }

        .fallback-link {
            margin-top: 20px;
            color: #3ea6ff;
            text-decoration: none;
            font-size: 14px;
        }

        .fallback-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>YouTube Shorts Player</h1>

    <div class="shorts-container">
        <div id="player"></div>
        <div class="error-message" id="errorMsg">
            Video failed to load. <br>
            <a href="https://www.youtube.com/shorts/iMgdzVQPR7E" target="_blank" class="fallback-link">Watch on YouTube</a>
        </div>
    </div>

    <a href="https://www.youtube.com/shorts/iMgdzVQPR7E" target="_blank" class="fallback-link">Open in YouTube</a>

    <script>
        // Load YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '560',
                width: '315',
                videoId: 'iMgdzVQPR7E',
                playerVars: {
                    'playsinline': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'enablejsapi': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            console.log('Player is ready');
            // Optional: Auto-play (may be blocked by browser)
            // event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            console.log('Player state changed:', event.data);
        }

        function onPlayerError(event) {
            console.error('YouTube Error Code:', event.data);
            
            var errorText = '';
            switch(event.data) {
                case 2:
                    errorText = 'Invalid video ID';
                    break;
                case 5:
                    errorText = 'HTML5 player error';
                    break;
                case 100:
                    errorText = 'Video not found (removed or private)';
                    break;
                case 101:
                case 150:
                    errorText = 'Embedding disabled by video owner';
                    break;
                default:
                    errorText = 'Unknown error (Code: ' + event.data + ')';
            }
            
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').innerHTML = 
                'Error: ' + errorText + '<br><br>' +
                '<a href="https://www.youtube.com/shorts/iMgdzVQPR7E" target="_blank" class="fallback-link">Watch on YouTube</a>';
        }

        // Timeout fallback if API fails to load
        setTimeout(function() {
            if (typeof YT === 'undefined' || !player) {
                console.log('YouTube API failed to load, using iframe fallback');
                document.getElementById('player').innerHTML = 
                    '<iframe width="315" height="560" src="https://www.youtube.com/embed/iMgdzVQPR7E?rel=0&modestbranding=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
            }
        }, 5000);
    </script>

</body>
</html>
