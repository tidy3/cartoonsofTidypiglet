<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Shorts Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 40px;
    }

    .wrapper {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      gap: 30px;
    }

    .short {
      position: relative;
      width: 315px;
      height: 560px;
      cursor: pointer;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    .short img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: white;
      background: rgba(0,0,0,0.3);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Preview -->
  <div class="short" onclick="play(this)">
    <img src="https://img.youtube.com/vi/iMgdzVQPR7E/hqdefault.jpg" alt="Short preview">
    <div class="play">▶</div>
  </div>

  <!-- Text -->
  <div>
    <h2>🐷 Cute Cartoon Short</h2>
    <p>
      A short and fun cartoon for kids.  
      Click the video to start watching.
    </p>
    <p>
      Original share link:<br>
      <a href="https://youtube.com/shorts/iMgdzVQPR7E?feature=share" target="_blank">
        Open on YouTube
      </a>
    </p>
  </div>

</div>

<script>
  function play(el) {
    el.innerHTML = `
      <iframe
        width="315"
        height="560"
        src="https://www.youtube-nocookie.com/embed/iMgdzVQPR7E?autoplay=1"
        frameborder="0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    `;
  }
</script>

</body>
</html>
