<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Player - Working Version</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-wrapper {
            position: relative;
            width: 315px;
            height: 560px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        /* Video Container */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Thumbnail Preview */
        .thumbnail-preview {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://i.ytimg.com/vi/iMgdzVQPR7E/maxresdefault.jpg');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .thumbnail-preview.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .play-button-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255,0,0,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .play-button-overlay:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-button-overlay::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 28px solid white;
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
            margin-left: 6px;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            z-index: 5;
            display: none;
        }

        .loading.show {
            display: block;
        }

        /* Controls */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .player-wrapper:hover .controls {
            opacity: 1;
        }

        .play-pause-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .play-pause-btn:hover {
            transform: scale(1.1);
        }

        .progress-container {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #ff0000;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            color: white;
            font-size: 12px;
            min-width: 50px;
            text-align: right;
        }

        /* Error Screen */
        .error-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
            z-index: 20;
        }

        .error-screen.show {
            display: flex;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .retry-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .retry-btn:hover {
            background: #444;
        }

        /* YouTube iframe */
        .youtube-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="player-wrapper" id="playerWrapper">
        <!-- Video Container -->
        <div class="video-container">
            <!-- YouTube iframe (initially hidden) -->
            <iframe 
                id="youtubeFrame"
                class="youtube-iframe"
                style="display: none;"
                width="315" 
                height="560"
                src="https://www.youtube.com/embed/iMgdzVQPR7E?enablejsapi=1&playsinline=1&rel=0&modestbranding=1&controls=0&disablekb=1&iv_load_policy=3&showinfo=0&autoplay=0"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
            
            <!-- Thumbnail Preview -->
            <div class="thumbnail-preview" id="thumbnailPreview" onclick="startVideo()">
                <div class="play-button-overlay"></div>
            </div>
            
            <!-- Loading -->
            <div class="loading" id="loading">Loading...</div>
            
            <!-- Error Screen -->
            <div class="error-screen" id="errorScreen">
                <div class="error-icon">⚠️</div>
                <div>Failed to load video</div>
                <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">Try clicking to play</div>
                <button class="retry-btn" onclick="location.reload()">Retry</button>
            </div>
            
            <!-- Controls -->
            <div class="controls" id="controls">
                <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
                <div class="progress-container" onclick="seek(event)">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
            </div>
        </div>
    </div>

    <script>
        // Load YouTube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;
        let isReady = false;
        let isPlaying = false;
        let updateInterval;
        let videoDuration = 0;

        function onYouTubeIframeAPIReady() {
            console.log('YouTube API ready');
            // Player will be created when user clicks play
        }

        function startVideo() {
            // Show iframe
            document.getElementById('youtubeFrame').style.display = 'block';
            document.getElementById('loading').classList.add('show');
            document.getElementById('thumbnailPreview').classList.add('hidden');
            
            // Create player instance
            player = new YT.Player('youtubeFrame', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            console.log('Player ready');
            isReady = true;
            document.getElementById('loading').classList.remove('show');
            
            // Get duration
            videoDuration = player.getDuration();
            updateTimeDisplay();
            
            // Start playing
            player.playVideo();
        }

        function onPlayerStateChange(event) {
            console.log('State changed:', event.data);
            
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('playPauseBtn').innerHTML = '❚❚';
                startProgressUpdate();
            } else if (event.data == YT.PlayerState.PAUSED) {
                isPlaying = false;
                document.getElementById('playPauseBtn').innerHTML = '▶';
                stopProgressUpdate();
            } else if (event.data == YT.PlayerState.ENDED) {
                isPlaying = false;
                document.getElementById('playPauseBtn').innerHTML = '▶';
                stopProgressUpdate();
            }
        }

        function onPlayerError(event) {
            console.error('Player error:', event.data);
            document.getElementById('loading').classList.remove('show');
            document.getElementById('errorScreen').classList.add('show');
        }

        function togglePlay() {
            if (!isReady) return;
            
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function startProgressUpdate() {
            updateInterval = setInterval(() => {
                try {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    const percent = (current / duration) * 100;
                    document.getElementById('progressBar').style.width = percent + '%';
                    updateTimeDisplay(current, duration);
                } catch(e) {}
            }, 100);
        }

        function stopProgressUpdate() {
            clearInterval(updateInterval);
        }

        function updateTimeDisplay(current = 0, duration = videoDuration) {
            const currentStr = formatTime(current);
            const durationStr = formatTime(duration);
            document.getElementById('timeDisplay').textContent = currentStr + ' / ' + durationStr;
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        function seek(event) {
            if (!isReady) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const percent = (event.clientX - rect.left) / rect.width;
            const duration = player.getDuration();
            player.seekTo(percent * duration, true);
        }

        // Timeout fallback
        setTimeout(() => {
            if (!isReady && document.getElementById('youtubeFrame').style.display !== 'none') {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('errorScreen').classList.add('show');
            }
        }, 8000);
    </script>

</body>
</html>
