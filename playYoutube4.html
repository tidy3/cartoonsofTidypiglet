<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts</title>
    <style>
        body {
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .short-card {
            width: 315px;
            height: 560px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            transition: transform 0.2s;
        }

        .short-card:hover {
            transform: scale(1.02);
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            background: url('https://img.youtube.com/vi/iMgdzVQPR7E/maxresdefault.jpg') center/cover;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.8) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255,0,0,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 25px solid white;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            margin-left: 5px;
        }

        .title {
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="short-card" onclick="window.open('https://www.youtube.com/shorts/iMgdzVQPR7E', '_blank')">
        <div class="thumbnail">
            <div class="play-button"></div>
            <div class="overlay">
                <div class="title">Watch Short</div>
                <div class="subtitle">Click to play on YouTube</div>
            </div>
        </div>
    </div>

</body>
</html>
