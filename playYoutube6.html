<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Shorts Embed Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    .short-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .short-wrapper {
      position: relative;
      width: 315px;
      height: 560px;
      cursor: pointer;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    .short-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      color: white;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      padding: 10px 22px;
      pointer-events: none;
    }

    .short-text h2 {
      margin-top: 0;
    }

    .short-text p {
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="short-container">

    <!-- YouTube Short preview -->
    <div class="short-wrapper" onclick="playShort(this)">
      <img
        src="https://img.youtube.com/vi/iMgdzVQPR7E/hqdefault.jpg"
        alt="YouTube Short preview">
      <div class="play-btn">▶</div>
    </div>

    <!-- Text on the right -->
    <div class="short-text">
      <h2>🐷 Funny Piglet Cartoon</h2>
      <p>
        A short and fun cartoon for kids with a cute animated piglet.
        Click the video to watch and enjoy the cartoon together!
      </p>
    </div>

  </div>

  <script>
    function playShort(element) {
      element.innerHTML = `
        <iframe
          width="315"
          height="560"
          src="https://www.youtube.com/embed/iMgdzVQPR7E?autoplay=1"
          frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      `;
    }
  </script>

</body>
</html>
