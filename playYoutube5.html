<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-container {
            position: relative;
            width: 315px;
            height: 560px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* Custom Controls Overlay */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .player-container:hover .controls {
            opacity: 1;
        }

        .controls.visible {
            opacity: 1;
        }

        /* Play/Pause Button */
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        /* Play Icon */
        .play-icon {
            width: 0;
            height: 0;
            border-left: 20px solid white;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            margin-left: 4px;
        }

        /* Pause Icon */
        .pause-icon {
            display: flex;
            gap: 6px;
        }

        .pause-icon::before,
        .pause-icon::after {
            content: '';
            width: 6px;
            height: 24px;
            background: white;
            border-radius: 2px;
        }

        /* Center Play Button (initial state) */
        .center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(255,0,0,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
            z-index: 10;
        }

        .center-play:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255,0,0,1);
        }

        .center-play.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .center-play .play-icon {
            border-left: 28px solid white;
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
            margin-left: 6px;
        }

        /* Loading State */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            display: none;
        }

        /* Error State */
        .error {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1a1a1a;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .error.show {
            display: flex;
        }

        .retry-btn {
            margin-top: 20px;
            padding: 12px 24px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .retry-btn:hover {
            background: #cc0000;
        }

        /* Progress Bar */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: #ff0000;
            width: 0%;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <!-- YouTube Player -->
        <div id="player"></div>
        
        <!-- Loading -->
        <div class="loading" id="loading">Loading...</div>
        
        <!-- Error Screen -->
        <div class="error" id="error">
            <div>Failed to load video</div>
            <button class="retry-btn" onclick="location.reload()">Retry</button>
        </div>
        
        <!-- Center Play Button -->
        <div class="center-play" id="centerPlay" onclick="togglePlay()">
            <div class="play-icon"></div>
        </div>
        
        <!-- Bottom Controls -->
        <div class="controls" id="controls">
            <div class="control-btn" id="playPauseBtn" onclick="togglePlay()">
                <div class="pause-icon" id="pauseIcon"></div>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress-container" id="progressContainer" onclick="seek(event)">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Load YouTube API -->
    <script>
        // Load the IFrame Player API code asynchronously
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isPlaying = false;
        var updateInterval;

        function onYouTubeIframeAPIReady() {
            document.getElementById('loading').style.display = 'block';
            
            player = new YT.Player('player', {
                height: '560',
                width: '315',
                videoId: 'iMgdzVQPR7E',
                playerVars: {
                    'playsinline': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'controls': 0,  // Hide default controls
                    'disablekb': 1, // Disable keyboard controls
                    'iv_load_policy': 3, // Hide annotations
                    'showinfo': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('loading').style.display = 'none';
            console.log('Player ready');
            
            // Set initial volume
            player.setVolume(100);
            
            // Start progress update
            updateInterval = setInterval(updateProgress, 100);
        }

        function onPlayerStateChange(event) {
            // Update UI based on state
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                updatePlayButton();
                document.getElementById('centerPlay').classList.add('hidden');
            } else if (event.data == YT.PlayerState.PAUSED) {
                isPlaying = false;
                updatePlayButton();
                document.getElementById('centerPlay').classList.remove('hidden');
            } else if (event.data == YT.PlayerState.ENDED) {
                isPlaying = false;
                updatePlayButton();
                document.getElementById('centerPlay').classList.remove('hidden');
            }
        }

        function onPlayerError(event) {
            console.error('YouTube Error:', event.data);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').classList.add('show');
        }

        function togglePlay() {
            if (!player || !player.getPlayerState) return;
            
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function updatePlayButton() {
            var btn = document.getElementById('playPauseBtn');
            var icon = document.getElementById('pauseIcon');
            
            if (isPlaying) {
                // Show pause icon
                icon.className = 'pause-icon';
            } else {
                // Show play icon
                icon.className = 'play-icon';
            }
        }

        function updateProgress() {
            if (!player || !player.getCurrentTime || !player.getDuration) return;
            
            try {
                var current = player.getCurrentTime();
                var duration = player.getDuration();
                var percent = (current / duration) * 100;
                document.getElementById('progressBar').style.width = percent + '%';
            } catch(e) {
                // Ignore errors
            }
        }

        function seek(event) {
            if (!player || !player.getDuration) return;
            
            var container = document.getElementById('progressContainer');
            var rect = container.getBoundingClientRect();
            var clickX = event.clientX - rect.left;
            var percent = clickX / rect.width;
            var duration = player.getDuration();
            var seekTime = percent * duration;
            
            player.seekTo(seekTime, true);
        }

        // Click on video to toggle play (optional)
        document.getElementById('playerContainer').addEventListener('click', function(e) {
            // Don't toggle if clicking controls
            if (e.target.closest('.controls') || e.target.closest('.center-play') || e.target.closest('.progress-container')) {
                return;
            }
            togglePlay();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (updateInterval) clearInterval(updateInterval);
        });
    </script>

</body>
</html>
